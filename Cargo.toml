[package]
name         = "core-ethos"
version      = "0.31.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/core-ethos"
description  = "Authority-sealed bootstrap reader and model for Interface, Nexus, and Sema Ethos documents."
publish      = false

[lib]
name = "core_ethos"
path = "src/lib.rs"

[dependencies]
content-identity         = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "df1d25c7cd9e822ae03255e04ede59a00b78480b" }
name-table               = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
raw-discovery            = { git = "https://github.com/LiGoldragon/raw-discovery.git", rev = "4112dad7728cbc531eb3f82ad902a0a030ffe85c" }
structural-codec         = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "5629c7b67f30" }
rkyv                     = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror                = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
